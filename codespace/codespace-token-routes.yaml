# Codespace Token API 能力清单。
#
# 本文件说明目标路由分类；Gitea 路由中间件是实际执行入口，测试用代表性
# 路由核对本清单。
schema_version: 3

fixed_routes:
  - { method: GET, path: /user, capability: self }
  - { method: GET, path: /version, capability: public_info }
  - { method: GET, path: /signing-key.gpg, capability: public_info }
  - { method: GET, path: /signing-key.pub, capability: public_info }

signed_routes:
  - { method: GET, path: "/repos/{username}/{reponame}/actions/artifacts/{artifact_id}/zip/raw", capability: signed_artifact }

repository_capabilities:
  code:
    read: [仓库基本信息, clone, fetch, 文件内容, 分支, 标签, commit, commit 状态]
    write: [push, 文件修改, 分支修改, 标签修改, commit 状态创建]
  issues:
    read: [Issue, 评论, 标签, 里程碑, 工时]
    write: [Issue 及其关联对象修改]
  pulls:
    read: [Pull Request, Review, 代码比较]
    write: [Pull Request, Review, 合并, 分支更新]
  wiki:
    read: [Wiki 页面和修订记录]
    write: [Wiki 页面修改]
  releases:
    read: [Release 和附件]
    write: [Release 和附件修改]
  actions:
    read: [工作流, 运行记录, Job, Artifact]
    write: [工作流触发和运行记录修改]

rules:
  - 源仓库能力使用创建者当前的 Gitea 仓库单元权限。
  - 附加仓库能力同时要求匹配的用户确认记录和创建者当前的 Gitea 仓库单元权限。
  - 未授权公开仓库的安全读取按匿名公开访问处理。
  - 仓库管理、账户、组织、Package、Notification、凭据、创建 fork 和创建仓库不属于 Codespace Token 能力。
  - Pull Request 请求同时校验路由能力和请求实际使用的每个外部 head 仓库。
  - 后续新增仓库路由只有在代码中声明相应能力并增加代表性测试后才接受 Codespace Token。
